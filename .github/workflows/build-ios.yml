name: Build iOS IPA

on:
  workflow_dispatch: # Manual trigger only

jobs:
  build-ios:
    runs-on: macos-15 # Has Xcode 16.x
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          # Dynamically pick the latest Xcode 16.x installed on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "❌ No Xcode 16.x found on this runner"
            ls /Applications/ | grep -i xcode || true
            exit 1
          fi
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          # Run first launch tasks so Xcode registers all platforms
          xcodebuild -runFirstLaunch 2>/dev/null || true
          echo "Available iOS SDKs:"
          xcodebuild -showsdks 2>/dev/null | grep -i iphone || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fail in a minute instead of after a 20-minute native build
      - name: Type check and test
        run: |
          npm run typecheck
          npm test -- --ci

      # Swift concurrency fixes for expo-modules-core live in patches/ and are
      # applied by patch-package on npm ci. Fail loudly if they didn't apply.
      - name: Verify expo-modules-core patches
        run: |
          EMC="node_modules/expo-modules-core"
          if ! grep -q "s.swift_version  = '5.10'" "$EMC/ExpoModulesCore.podspec"             || grep -q "@MainActor AnyExpoSwiftUIHostingView" "$EMC/ios/Core/Views/SwiftUI/SwiftUIHostingView.swift"             || grep -q "extension UIView: @MainActor AnyArgument" "$EMC/ios/Core/Views/ViewDefinition.swift"; then
            echo "❌ expo-modules-core patches are missing — check patches/ and the postinstall output"
            exit 1
          fi
          echo "✅ expo-modules-core patches applied"

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build unsigned IPA
        working-directory: ios
        run: |
          # Build the .app for device (arm64) without code signing
          # Use -arch arm64 instead of -destination to avoid platform detection issues
          xcodebuild \
            -workspace MusicPlayer.xcworkspace \
            -scheme MusicPlayer \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package IPA
        run: |
          # Find the .app bundle
          APP_PATH=$(find ios/build -name "MusicPlayer.app" -type d | head -1)
          echo "Found app at: $APP_PATH"

          # Create Payload directory structure for IPA
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

          # Create the IPA (it's just a zip)
          zip -r MusicPlayer.ipa Payload
          rm -rf Payload

          echo "✅ IPA created: MusicPlayer.ipa"
          ls -lh MusicPlayer.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-unsigned
          path: MusicPlayer.ipa
          retention-days: 30
